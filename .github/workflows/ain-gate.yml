name: AIN change gate

on:
  pull_request:

jobs:
  validate-and-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate AIN artifacts
        run: python3 .ain/runtime/ain.py --target . validate
      - name: Extract change ID from PR title
        id: change
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" =~ (CHG-[0-9]{8}-[0-9]{3,}) ]]; then
            echo "id=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "id=" >> "$GITHUB_OUTPUT"
          fi
      - name: Guard product diff against the approved plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGE_ID: ${{ steps.change.outputs.id }}
        run: |
          args=(--target . guard --base "$BASE_SHA" --head "$HEAD_SHA")
          if [ -n "$CHANGE_ID" ]; then
            args+=(--change "$CHANGE_ID")
          fi
          python3 .ain/runtime/ain.py "${args[@]}"
